[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hysds-sciflo"
dynamic = ["version"]
description = "SciFlo workflow framework and engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Brian Wilson", email = "Brian.Wilson@jpl.nasa.gov"},
]
maintainers = [
    {name = "Gerald Manipon", email = "Geraldjohn.M.Manipon@jpl.nasa.gov"},
]
keywords = ["hysds", "sciflo", "workflow", "framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core dependencies - matching original setup.py order and pins exactly
    "twisted>=18.9.0",
    "pillow>=5.4.1",
    "formencode>=1.3.1",
    "sqlobject>=3.7.1",
    "service_identity>=18.1.0",
    "python-magic>=0.4.15",
]

[project.optional-dependencies]
test = [
    "hysds-commons>=7.0,<8.0",
    "hysds-core>=7.0,<8.0",
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
"filelist.py" = "sciflo.utils.filelist:main"
"subsetAeronet.py" = "sciflo.data.aeronet.subset:main"
"hdfMetadata.py" = "sciflo.data.hdf:main"
sflExec = "sciflo.scripts.sflExec:main"
ldapSearch = "sciflo.scripts.ldapSearch:main"
ldapAuth = "sciflo.scripts.ldapAuth:main"
insertDataFromXml = "sciflo.scripts.insertDataFromXml:main"
crawlAll = "sciflo.scripts.crawlAll:main"
getConfigVal = "sciflo.scripts.getConfigVal:main"
sciflod = "sciflo.scripts.sciflod:main"

[project.urls]
Homepage = "https://github.com/hysds/sciflo"
Repository = "https://github.com/hysds/sciflo"
Issues = "https://github.com/hysds/sciflo/issues"

[tool.hatch.version]
source = "vcs"
raw-options = {version_scheme = "no-guess-dev"}

[tool.hatch.build.targets.wheel]
packages = ["sciflo"]

[tool.hatch.build.targets.sdist]
include = [
    "/sciflo",
    "/scripts",
    "/tac",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel.force-include]
"tac/PersistentDictServer.tac" = "share/sciflo/tac/PersistentDictServer.tac"
